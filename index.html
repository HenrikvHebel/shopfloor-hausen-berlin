<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<title>Shopfloor Hausen–Berlin</title>
<style>
  :root { --bg:#f2f3f5; --card:#fff; --ink:#1b1d21; --muted:#6b7078; --line:#dfe1e5; --accent:#1565c0;
          --low:#fff4d6; --lowb:#e0a800; --zero:#fde2e1; --zerob:#c62828; --ok:#2e7d32; --okbg:#e3f2e5; --add:#2e7d32; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:"DejaVu Sans",Arial,sans-serif;
              font-size:16px; overflow-x:hidden; }
  button, input, select, textarea { font:inherit; color:inherit; }
  header { position:sticky; top:0; z-index:5; background:var(--ink); color:#fff;
           display:flex; align-items:center; gap:10px; padding:10px 16px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  #info { font-size:13px; opacity:.75; flex:1; min-width:120px; }
  header button { font-size:15px; padding:8px 14px; border:0; border-radius:8px; background:#3a3f47; color:#fff; cursor:pointer; }
  nav { display:flex; gap:6px; padding:10px 16px 0; flex-wrap:wrap; }
  nav a { font-size:16px; padding:9px 16px; border-radius:22px; border:2px solid #c9ccd1; background:#fff;
          color:var(--ink); text-decoration:none; white-space:nowrap; }
  nav a.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { padding:12px 16px 40px; max-width:1200px; margin:0 auto; }
  h2 { font-size:20px; margin:14px 0 8px; }
  h3 { font-size:17px; margin:12px 0 6px; }
  .muted { color:var(--muted); font-size:14px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .bar .grow { flex:1; }
  .btn { font-size:16px; padding:10px 16px; border:0; border-radius:8px; background:#c9ccd1; cursor:pointer; min-height:44px; }
  .btn.pri { background:var(--accent); color:#fff; font-weight:600; }
  .btn.ok { background:var(--add); color:#fff; font-weight:600; }
  .btn.bad { background:var(--zerob); color:#fff; font-weight:600; }
  .btn.sm { font-size:14px; padding:6px 10px; min-height:34px; }
  .btn:disabled { opacity:.5; }
  .chip { display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:10px;
          background:#e9ecef; margin:2px 4px 2px 0; white-space:nowrap; }
  .chip.bad { background:var(--zero); color:var(--zerob); }
  .chip.warn { background:var(--low); color:#7a5b00; }
  .chip.good { background:var(--okbg); color:var(--ok); }
  .chip.info { background:#dbe8f8; color:var(--accent); }
  .list { display:grid; gap:8px; }
  .item { background:var(--card); border-radius:10px; padding:10px 12px; box-shadow:0 1px 3px rgba(0,0,0,.12);
          border-left:5px solid transparent; }
  .item.bad { border-left-color:var(--zerob); }
  .item.warn { border-left-color:var(--lowb); }
  .item.good { border-left-color:var(--ok); }
  .item .top { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .item .title { font-weight:600; font-size:16px; }
  .item .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:4px 12px; margin-top:6px; font-size:14px; }
  .item .grid b { display:block; font-size:12px; color:var(--muted); font-weight:normal; }
  .item .acts { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .click { cursor:pointer; }
  .click:hover { box-shadow:0 2px 8px rgba(0,0,0,.2); }
  .stock.low { color:#7a5b00; font-weight:600; }
  .stock.zero { color:var(--zerob); font-weight:700; }
  .empty { text-align:center; color:var(--muted); padding:20px; background:#fff; border-radius:10px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .kpi { background:var(--card); border-radius:12px; padding:12px; border:3px solid #c9ccd1; }
  .kpi.good { border-color:var(--ok); background:var(--okbg); }
  .kpi.bad { border-color:var(--zerob); background:var(--zero); }
  .kpi .l { font-size:14px; font-weight:600; }
  .kpi .v { font-size:32px; font-weight:700; margin:4px 0; }
  .kpi .h { font-size:12px; color:var(--muted); }
  .steps { display:flex; gap:4px; margin:6px 0 10px; }
  .steps div { flex:1; height:8px; border-radius:4px; background:#c9ccd1; cursor:pointer; }
  .steps div.done { background:#90b4e0; }
  .steps div.on { background:var(--accent); }
  #mtimer { font-variant-numeric:tabular-nums; font-weight:600; }
  #mtimer.over { color:var(--zerob); }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { flex:1; min-width:80px; padding:10px; border-radius:8px; border:2px solid #c9ccd1; background:#fff; cursor:pointer; }
  .seg button.on { border-color:var(--accent); background:var(--accent); color:#fff; font-weight:600; }
  form .f { margin-bottom:10px; }
  form label { display:block; font-size:14px; color:var(--muted); margin-bottom:3px; }
  form input, form select, form textarea { width:100%; font-size:16px; padding:9px 10px; border:2px solid #c9ccd1;
          border-radius:8px; background:#fff; min-height:44px; }
  form textarea { min-height:70px; }
  form input:focus, form select:focus, form textarea:focus { border-color:var(--accent); outline:none; }
  form .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  form .chk { display:flex; align-items:center; gap:8px; font-size:16px; color:var(--ink); }
  form .chk input { width:22px; height:22px; min-height:0; }
  .olines .ol { display:grid; grid-template-columns:1fr 2fr 90px auto; gap:6px; margin-bottom:6px; align-items:end; }
  .bigid { font-size:30px; font-weight:700; color:var(--accent); text-align:center; margin:10px 0; letter-spacing:1px; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; display:none;
             align-items:flex-start; justify-content:center; overflow-y:auto; padding:20px 12px; }
  #modal { background:#fff; border-radius:14px; padding:18px; width:100%; max-width:560px; }
  #modal h2 { margin-top:0; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); display:none; max-width:92vw;
           background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px; font-size:16px;
           box-shadow:0 4px 16px rgba(0,0,0,.35); z-index:50; }
  #toast.err { background:var(--zerob); }
  #login { display:none; max-width:560px; margin:60px auto; background:#fff; border-radius:12px; padding:28px;
           font-size:18px; line-height:1.5; text-align:center; }
  #busy { position:fixed; top:0; left:0; right:0; height:3px; background:var(--accent); z-index:60; display:none;
          animation:pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity:.3; } to { opacity:1; } }
  @media (max-width:560px) {
    header h1 { font-size:17px; }
    form .row2 { grid-template-columns:1fr; }
    .olines .ol { grid-template-columns:1fr 1fr; }
    .kpi .v { font-size:26px; }
  }
</style>
</head>
<body>
<div id="busy"></div>
<header>
  <h1 id="title">Shopfloor Hausen ↔ Berlin</h1><span id="info"></span>
  <button id="reload" type="button">Aktualisieren</button>
  <button id="logout" type="button">Abmelden</button>
</header>
<div id="login">
  <div>Anmeldung mit dem Firmen-Microsoft-Konto erforderlich.</div>
  <p><button class="btn pri" id="loginbtn" type="button">Anmelden</button></p>
  <div id="lerr" style="color:#c62828"></div>
</div>
<div id="app" style="display:none">
  <nav id="nav">
    <a href="#meeting" data-v="meeting">Meeting</a>
    <a href="#bestellungen" data-v="bestellungen">Bestellungen</a>
    <a href="#versand" data-v="versand">Versand</a>
    <a href="#eingang" data-v="eingang">Wareneingang</a>
    <a href="#probleme" data-v="probleme">Probleme</a>
  </nav>
  <main id="view"></main>
</div>
<div id="overlay"><div id="modal"></div></div>
<div id="toast"></div>
<script src="vendor/msal-browser.min.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
